        (memo ? "✎" : (x.done ? "✓" : "")) + "</button>" +
        '<input class="g-title n-text" data-id="' + esc(x.id) + '" type="text" maxlength="200" value="' + esc(x.text || "") + '">' +
        '<button class="iconbtn n-del" data-id="' + esc(x.id) + '" title="삭제">✕</button></li>';
    };
    return '<div class="sec-t" id="noteTop">메모</div>' +
      '<div class="card" id="noteCard"><div class="card-h"><h2>적어 둘 것</h2>' +
        '<span class="g-count">' + (live.length ? live.length + "개 남음" : its.length ? "다 했습니다" : "") + "</span></div>" +
      '<div class="card-b">' +
        (its.length
          ? '<ul class="goals notes">' + live.map(row).join("") + done.map(row).join("") + "</ul>"
          : '<div class="empty"><b>비어 있습니다</b>확인할 것·살 것처럼 시간으로 적기 애매한 걸 두세요. 날짜에 묶이지 않고 달성률에도 들어가지 않습니다.</div>') +
        '<div class="g-add-row n-row">' +
          '<input class="g-new n-new" type="text" maxlength="200" placeholder="적어 두기 (예: 장학금 신청 확인)">' +
          '<button class="btn n-add">추가</button>' +
        "</div>" +
        '<div class="legend"><span>체크 아이콘을 길게 누르면 ☐ 할 것 ↔ ✎ 메모가 바뀝니다</span>' +
        (done.length ? '<span><button class="lnk n-clear">완료한 것 ' + done.length + "개 지우기</button></span>" : "") +
      "</div></div></div>";
  }

  function goalList(which, title, hint, rangeStart, rangeEnd) {
    const list = goalsOf(which).slice().sort((a, b) => (a.done - b.done) || ((a.due || "9") < (b.due || "9") ? -1 : 1));
    const done = list.filter((g) => g.done).length;
    return '<div class="card gl" data-which="' + which + '">' +
      '<div class="card-h"><h2>' + title + "</h2>" +
        '<span class="g-count">' + (list.length ? done + " / " + list.length : "") + "</span></div>" +
      '<div class="card-b">' +
        (list.length
          ? '<div class="bar" style="margin:0 0 11px"><i style="width:' + (list.length ? done / list.length * 100 : 0) + '%;--c:var(--ok)"></i></div>' +
            '<ul class="goals">' + list.map((g) => {
              const late = g.due && !g.done && g.due < todayKey;
              return '<li class="' + (g.done ? "done" : "") + '">' +
                '<button class="g-chk" data-id="' + esc(g.id) + '" aria-pressed="' + !!g.done + '" title="완료 표시">' + (g.done ? "✓" : "") + "</button>" +
                '<input class="g-title" data-id="' + esc(g.id) + '" type="text" maxlength="120" value="' + esc(g.title) + '">' +
                (g.due
                  ? '<input class="g-due' + (late ? " late" : "") + '" data-id="' + esc(g.id) + '" type="date" value="' + esc(g.due) + '" min="' + esc(rangeStart) + '" max="' + esc(rangeEnd) + '" title="목표 날짜">'
                  : '<button class="g-adddue" data-id="' + esc(g.id) + '" data-min="' + esc(rangeStart) + '" data-max="' + esc(rangeEnd) + '" title="목표 날짜 넣기">+ 날짜</button>') +
                '<button class="iconbtn g-del" data-id="' + esc(g.id) + '" title="삭제">✕</button></li>';
            }).join("") + "</ul>"
          : '<div class="empty"><b>아직 목표가 없습니다</b>' + hint + "</div>") +
        '<div class="g-add-row">' +
          '<input class="g-new" type="text" maxlength="120" placeholder="목표 추가">' +
          '<input class="g-newdue" type="date" min="' + esc(rangeStart) + '" max="' + esc(rangeEnd) + '" title="날짜(선택)" aria-label="날짜(선택)">' +
          '<button class="btn g-add">추가</button>' +
        "</div>" +
      "</div></div>";
  }

  function monthBody() {
    const days = monthDays(anchor), first = days[0], last = days[days.length - 1];
    const dueM = {}; goalsOf("m").forEach((g) => { if (g.due) (dueM[g.due] = dueM[g.due] || []).push(g); });
    const lead = (parseKey(first).getDay() + 6) % 7;
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push('<div class="cell void"></div>');
    const hbMap = (hbDayCache && hbDayCache.map) || {};
    days.forEach((k) => {
      const dd = parseKey(k), hit = dueM[k] || [], hbs = hbOn(k).slice(0, 4), rec = hbMap[k];
      const tip = k + (hbs.length ? " · " + hbs.map((x) => x.title + " " + hbCount(rec, x.id) + "/" + hbTarget(x)).join(", ") : "") +
        (hit.length ? " · 목표: " + hit.map((g) => g.title).join(", ") : "");
      /* 그날 사진 한 장을 칸 배경으로, 일일목표(할일) 달성은 아래 숫자로 — 사용자 요청 2026-10-19 */
      const th = ((rec && rec.logs) || []).map(thumbOf).filter(Boolean)[0] || "";
      const tk = (rec && rec.tasks) || [];
      const tkDone = tk.filter((x) => x && x.done).length;
      cells.push('<button class="cell' + (k === todayKey ? " tdy" : "") + (th ? " hasph" : "") + '" data-go="' + k + '" title="' +
        esc(tip + (tk.length ? " · 할일 " + tkDone + "/" + tk.length : "")) + '"' +
        (th ? ' style="background-image:url(' + esc(th) + ')"' : "") + ">" +
        (hit.length ? '<span class="gdot' + (hit.every((g) => g.done) ? " ok" : "") + '"></span>' : "") +
        '<span class="dn">' + dd.getDate() + "</span>" +
        (tk.length ? '<span class="tk">' + tkDone + "/" + tk.length + "</span>" : "") +
        (hbs.length ? '<span class="hdots">' + hbs.map((x) =>
          '<i class="' + (hbCount(rec, x.id) >= hbTarget(x) ? "on" : "") + '" style="--c:' + esc(tag(x.tagId).color) + '"></i>').join("") + "</span>" : "") +
        "</button>");
    });
    const ws = weeksOfMonth(anchor), sum = S.ov.weekSum || {};
    return goalList("m", "이번 달 목표", "한 달 동안 끝내고 싶은 걸 크게 적어 두세요. 날짜를 붙이면 아래 달력에 표시됩니다.", first, last) +
      '<div class="sec-t">주별 목표</div>' +
      '<div class="card"><div class="card-b"><div class="wk-rows">' +
        ws.map((w) => {
          const s = sum[w], e = shiftKey(w, 6), cur = w === weekStart(todayKey);
          return '<button class="wk-row' + (cur ? " cur" : "") + '" data-week="' + w + '">' +
            '<span class="wl">' + weekLabel(w) + (cur ? ' <span class="pc">이번 주</span>' : "") + "</span>" +
            '<span class="wn">' + (s ? (s.n ? s.done + " / " + s.n + "개" : "비어 있음") : "…") + "</span>" +
            '<span class="wc">›</span></button>';
        }).join("") +
      '</div><div class="legend"><span>주를 누르면 그 주의 목표로 갑니다</span></div></div></div>' +
      '<div class="sec-t">날짜</div>' +
      '<div class="card"><div class="card-b"><div class="cal">' +
        ["월", "화", "수", "목", "금", "토", "일"].map((x) => '<div class="dh">' + x + "</div>").join("") +
        cells.join("") +
      '</div><div class="legend"><span>날짜를 누르면 그 날의 할일·타임라인으로 갑니다</span><span>칸 배경은 그날 사진 · 아래 숫자는 할일 달성</span>' +
        ((S.hb.items || []).length ? '<span>아래 점은 매일 반복 · 채워지면 그 날 다 한 것</span>' : "") +
        '<span><b class="dotl"></b>목표 날짜</span></div></div></div>';
  }

  function weekBody() {
    const ws = weekStart(anchor), days = []; for (let i = 0; i < 7; i++) days.push(shiftKey(ws, i));
    const dueW = {}; goalsOf("w").forEach((g) => { if (g.due) (dueW[g.due] = dueW[g.due] || []).push(g); });
    const mItems = goalsOf("m"), mDone = mItems.filter((g) => g.done).length;
    return goalList("w", "이번 주 목표", "이번 주에 끝낼 것만 몇 개 적어 두세요. 예: SPSS 강의 듣기.", ws, days[6]) +
      '<div class="sec-t">날짜</div>' +
      '<div class="card"><div class="card-b"><div class="wdays">' +
        days.map((k) => {
          const dd = parseKey(k), hit = dueW[k] || [];
          return '<button class="wday' + (k === todayKey ? " tdy" : "") + '" data-go="' + k + '">' +
            '<span class="wd">' + DOW[dd.getDay()] + "</span><span class=\"dn\">" + dd.getDate() + "</span>" +
            '<span class="gl-mini">' + (hit.length ? hit.map((g) => '<i class="' + (g.done ? "ok" : "") + '" title="' + esc(g.title) + '"></i>').join("") : "") + "</span></button>";
        }).join("") +
      '</div><div class="legend"><span>날짜를 누르면 그 날의 할일·타임라인으로 갑니다</span></div></div></div>' +
      '<div class="sec-t">' + monthLabel(anchor) + " 목표</div>" +
      '<div class="card"><div class="card-b">' +
        (mItems.length
          ? '<ul class="goals ro">' + mItems.slice().sort((a, b) => a.done - b.done).map((g) =>
              '<li class="' + (g.done ? "done" : "") + '"><span class="g-mk">' + (g.done ? "✓" : "·") + "</span>" +
              '<span class="g-ro">' + esc(g.title) + "</span>" +
              '<span class="n">' + (g.due ? g.due.slice(5).replace("-", "/") : "") + "</span></li>").join("") + "</ul>" +
            '<div class="legend"><span>' + mDone + " / " + mItems.length + ' 완료 · 고치려면 <button class="lnk" id="ovToM">월간</button>으로</span></div>'
          : '<div class="empty">이 달의 목표가 비어 있습니다. <button class="lnk" id="ovToM">월간에서 적기</button></div>') +
      "</div></div>";
  }
}

    '<div class="sec-t">매일 반복</div>' +
    '<div class="card"><div class="card-b"><div class="taglist" id="hbList"></div>' +
      '<button class="btn ghost" id="addHb" style="margin-top:10px;width:100%">반복 추가</button>' +
      '<p class="rt-note">시간이 아니라 <b>횟수</b>로 세는 일입니다. 요일 루틴과 달리 타임라인에는 들어가지 않고, 오늘 화면 위쪽 띠에서 눌러 세면 됩니다.<br>' +
      '하루 목표가 1이면 체크, 2 이상이면 누를 때마다 1씩 오르고 다 채운 뒤 한 번 더 누르면 0으로 돌아갑니다. 길게 누르면 바로 지워집니다.</p>' +
    "</div></div>" +
    '<div class="sec-t">데이터</div>' +
    '<div class="card"><div class="card-b"><div style="font-size:12.5px;color:var(--muted);line-height:1.65">' +
      (FB && DB ? "<b>" + esc(S.email) + "</b> 계정의 클라우드에 저장됩니다. 같은 계정으로 로그인한 PC·휴대폰이 같은 기록을 공유하고, 앱이 업데이트돼도 기록은 그대로 남습니다."
          : "지금은 이 브라우저에만 저장됩니다.") +
      '<br>날짜별로 한 건씩 저장되므로 과거 날짜는 왼쪽 상단 화살표로 언제든 열어 수정할 수 있습니다.</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px">' +
        '<button class="btn ghost" id="dExp">백업 (사진 없이)</button>' +
        '<button class="btn ghost" id="dExpP">백업 (사진 포함)</button>' +
        '<button class="btn ghost" id="dImp">백업 불러오기</button>' +
        (FB ? '<button class="btn ghost" id="dOut">로그아웃</button>' : "") +
        '<input type="file" id="dFile" accept="application/json,.json" hidden>' +
      "</div></div></div>";
  $("#dExp").onclick = () => exportAll(false);
  $("#dExpP").onclick = () => exportAll(true);
  $("#dImp").onclick = () => $("#dFile").click();
  $("#dFile").onchange = (e) => { if (e.target.files[0]) importAll(e.target.files[0]); };
  if ($("#dOut")) $("#dOut").onclick = async () => { try { await FB.signOut(); } catch (x) { } location.reload(); };

  $("#sStart").onchange = () => { S.set.dayStart = +$("#sStart").value; fixWindow(); };
  $("#sEnd").onchange = () => { S.set.dayEnd = +$("#sEnd").value; fixWindow(); };
  const list = $("#tagList");
  list.innerHTML = S.set.tags.map((t, i) =>
    '<div class="tagedit" data-i="' + i + '"><span class="draghandle" title="끌어서 순서 바꾸기" aria-label="순서 바꾸기">⠿</span><input type="color" value="' + esc(t.color) + '" aria-label="색"><input type="text" value="' + esc(t.name) + '" maxlength="14" aria-label="태그 이름">' +
    '<button class="iconbtn" data-del="' + i + '" title="삭제" ' + (S.set.tags.length <= 1 ? "disabled" : "") + ">✕</button></div>").join("");
  list.querySelectorAll(".tagedit").forEach((row) => {
    const i = +row.dataset.i;
    row.querySelector('input[type=color]').oninput = (e) => { S.set.tags[i].color = e.target.value; saveSet(); drawTasks(); drawTimeline(); };
    row.querySelector('input[type=text]').onchange = (e) => { S.set.tags[i].name = e.target.value.trim() || S.set.tags[i].name; saveSet(); drawTagSelect(); drawTasks(); };
    const del = row.querySelector("[data-del]");
    if (del) del.onclick = () => { S.set.tags.splice(i, 1); saveSet(); drawSettings(); };
  });
  /* 태그 순서 바꾸기 — 손잡이(⠿)를 끌어 올리거나 내린다. 순서는 태그 선택 목록에도 그대로 쓰인다. */
  list.querySelectorAll(".draghandle").forEach((h) => {
    h.onpointerdown = (e) => {
      if (e.button === 2) return;
      e.preventDefault();
      const row = h.closest(".tagedit");
      row.classList.add("dragging");
      let changed = false;
      /* 줄을 옮기면 DOM에서 빠졌다 들어가 포인터 캡처가 풀리므로 window에서 받는다 */
      const move = (ev) => {
        const over = document.elementFromPoint(list.getBoundingClientRect().left + 10, ev.clientY);
        const tgt = over && over.closest && over.closest(".tagedit");
        if (!tgt || tgt === row || tgt.parentNode !== list) return;
        const r = tgt.getBoundingClientRect(), before = ev.clientY < r.top + r.height / 2;
        const after = tgt.nextSibling;
        if (before) { if (tgt.previousSibling !== row) { list.insertBefore(row, tgt); changed = true; } }
        else if (after !== row) { list.insertBefore(row, tgt.nextSibling); changed = true; }
      };
      const done = () => {
        window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", done); window.removeEventListener("pointercancel", done);
        row.classList.remove("dragging");
        if (!changed) return;
        const order = [...list.querySelectorAll(".tagedit")].map((r2) => +r2.dataset.i);
        S.set.tags = order.map((k) => S.set.tags[k]);
        saveSet(); drawSettings(); drawTagSelect(); drawTasks(); drawTimeline();
      };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", done); window.addEventListener("pointercancel", done);
    };
  });
  $("#addTag").onclick = () => {
    S.set.tags.push({ id: "t" + uid().slice(0, 5), name: "새 태그", color: "#5A7D8C" });
    saveSet(); drawSettings();
  };

  /* 지출 분류 — 태그와 같은 모양이지만 축이 다르다. 순서 바꾸기는 아직 없음(통계는 금액 순으로 정렬된다). */
  const cl = $("#catList");
  cl.innerHTML = (S.set.cats || []).map((c, i) =>
    '<div class="tagedit" data-i="' + i + '"><input type="color" value="' + esc(c.color) + '" aria-label="색"><input type="text" value="' + esc(c.name) + '" maxlength="14" aria-label="분류 이름">' +
    '<button class="iconbtn" data-del="' + i + '" title="삭제">✕</button></div>').join("");
  cl.querySelectorAll(".tagedit").forEach((row) => {
    const i = +row.dataset.i;
    row.querySelector('input[type=color]').oninput = (e) => { S.set.cats[i].color = e.target.value; saveSet(); };
    row.querySelector('input[type=text]').onchange = (e) => { S.set.cats[i].name = e.target.value.trim() || S.set.cats[i].name; saveSet(); };
    /* 지운 분류를 쓰던 기록은 "미분류"로 보인다 — 기록 자체는 건드리지 않는다(다시 만들면 되살아난다). */
    row.querySelector("[data-del]").onclick = () => { S.set.cats.splice(i, 1); saveSet(); drawSettings(); };
  });
  $("#addCat").onclick = () => {
    S.set.cats.push({ id: "c" + uid().slice(0, 5), name: "새 분류", color: "#5A7D8C" });
    saveSet(); drawSettings();
  };

  const rl = $("#rtList");
  rl.innerHTML = S.rt.items.length ? S.rt.items.map((r, i) =>
    '<div class="rt-row" data-i="' + i + '">' +
      '<div class="rt-top"><input type="text" class="rt-name" maxlength="40" value="' + esc(r.title || "") + '" placeholder="예: 자료구조 수업" aria-label="루틴 이름">' +
      '<select class="rt-tag" aria-label="태그">' + tagOptions(r.tagId) + "</select>" +
      '<button class="iconbtn rt-del" title="루틴 삭제">✕</button></div>' +
      '<div class="rt-days">' + DOW.map((n, k) =>
        '<button class="rt-day" data-d="' + k + '" aria-pressed="' + ((r.days || []).indexOf(k) >= 0) + '">' + n + "</button>").join("") + "</div>" +
      '<div class="rt-time">' + timeSelHTML("rts", r.start, "시작", true) +
      "<span>→</span>" +
      timeSelHTML("rte", r.end, "종료", true) + "</div>" +
    "</div>").join("")
    : '<div class="empty">아직 루틴이 없습니다. 수업·알바처럼 매주 같은 시간에 반복되는 일정을 추가해 보세요.</div>';

  rl.querySelectorAll(".rt-row").forEach((row) => {
    const i = +row.dataset.i, r = S.rt.items[i];
    const commit = () => { saveRt(); refreshRoutine(r.id); };
    row.querySelector(".rt-name").onchange = (e) => { r.title = e.target.value.trim() || "루틴"; commit(); drawSettings(); };
    row.querySelector(".rt-tag").onchange = (e) => { r.tagId = e.target.value; commit(); };
    timeSelOn("rts", row, true, () => {
      const v = timeSelRead("rts", row, true);
      if (v != null) { r.start = v; if (r.end <= r.start) r.end = r.start + 60; }
      commit(); drawSettings();
    });
    timeSelOn("rte", row, true, () => {
      const v = timeSelRead("rte", row, true);
      if (v != null && v > r.start) r.end = v; else { note("종료는 시작보다 늦어야 합니다."); }
      commit(); drawSettings();
    });
    row.querySelectorAll(".rt-day").forEach((db) => db.onclick = () => {
      const k = +db.dataset.d;
      r.days = Array.isArray(r.days) ? r.days : [];
      const at = r.days.indexOf(k);
      if (at >= 0) r.days.splice(at, 1); else r.days.push(k);
      db.setAttribute("aria-pressed", at < 0);
      commit();
    });
    row.querySelector(".rt-del").onclick = () => {
      const id = r.id;
      S.rt.items.splice(i, 1); saveRt(); refreshRoutine(id); drawSettings();
    };
  });
  $("#addRt").onclick = () => {
    S.rt.items.push({ id: "r" + uid(), title: "새 루틴", tagId: S.set.tags[0].id, days: [1, 2, 3, 4, 5], start: 540, end: 600 });
    saveRt(); applyRoutines(); drawSettings();
  };
  drawHabitSettings();
  if (readOnly) host.querySelectorAll("input,select,button").forEach((e) => e.disabled = true);
}
function fixWindow() {
  S.set.dayStart = clamp(Math.round(S.set.dayStart / 60) * 60, 0, 780);
  S.set.dayEnd = clamp(Math.round(S.set.dayEnd / 60) * 60, S.set.dayStart + 360, 1680);
  saveSet(); drawSettings();
}
function saveSet() { save("settings/app", { tags: S.set.tags, cats: S.set.cats, places: S.set.places || [], dayStart: S.set.dayStart, dayEnd: S.set.dayEnd }); }

/* 날짜·시간 칸은 작은 아이콘을 정확히 눌러야 열린다. 칸 어디를 눌러도 열리게 한다. */
addEventListener("click", (e) => {
  const el = e.target && e.target.closest ? e.target.closest('input[type="date"],input[type="time"]') : null;
  if (!el || el.disabled || el.readOnly) return;
  try { el.showPicker(); } catch (x) { }
}, true);

/* ============================== nav ============================== */
/* 다른 탭에서 탭 버튼으로 돌아오면 오늘 날짜로. 목표 탭의 날짜 클릭(data-go)은 view를 직접 바꾸므로 영향 없음. */
$("#tabToday").onclick = () => {
  const back = S.view !== "today", t = keyOf(new Date());
  S.view = "today";
  if (back && S.dateKey !== t) openDay(t); else render();
};
$("#tabStats").onclick = () => { S.view = "stats"; render(); drawStats(); };
$("#tabOver").onclick = () => { S.view = "over"; S.ov.anchor = keyOf(new Date()); render(); drawOver(); loadWeekSummary(); loadHabitDays(true); };
$("#noteChip").onclick = () => { S.ov.jump = true; $("#tabOver").click(); };
$("#tabSet").onclick = () => { S.view = "set"; render(); };
$("#prevDay").onclick = () => openDay(shiftKey(S.dateKey, -1));
$("#nextDay").onclick = () => openDay(shiftKey(S.dateKey, 1));
$("#goToday").onclick = () => openDay(keyOf(new Date()));
try {
  const h = (location.hash || "").replace("#", "");
  if (h === "stats" || h === "set" || h === "over") { S.view = h; render(); if (h === "stats") drawStats(); if (h === "over") { drawOver(); loadWeekSummary(); loadHabitDays(true); } }
} catch (e) { }
</script>

<script type="module" src="./fb.js" onerror="window.__fbResolve&&window.__fbResolve(null)"></script>
<script>
/* Installed app: register the worker so it opens offline and refreshes itself. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
